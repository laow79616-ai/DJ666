server {
    server_name www.dj666.pw dj666.pw;
    client_max_body_size 4096m;
    client_body_timeout 3600s;

    # announce-media-upload: stream large image/video uploads straight to the app
    location ~ ^/(admin/announcements/media|chat/media)$ {
        client_max_body_size 4096m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.dj666.pw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.dj666.pw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = dj666.pw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.dj666.pw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.dj666.pw dj666.pw;
    return 404; # managed by Certbot




}